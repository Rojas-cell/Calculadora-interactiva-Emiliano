<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Funcional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <div class="pantalla">
            <div id="valor-anterior" class="anterior"></div>
            <div id="valor-actual" class="actual">0</div>
        </div>

        <div class="teclado">
            <button class="btn-ac span-dos" id="btn-limpiar">AC</button>
            <button class="btn-del" id="btn-borrar">DEL</button>
            <button class="btn-operador" data-operador="÷">÷</button>

            <button class="btn-numero" data-numero="7">7</button>
            <button class="btn-numero" data-numero="8">8</button>
            <button class="btn-numero" data-numero="9">9</button>
            <button class="btn-operador" data-operador="×">×</button>

            <button class="btn-numero" data-numero="4">4</button>
            <button class="btn-numero" data-numero="5">5</button>
            <button class="btn-numero" data-numero="6">6</button>
            <button class="btn-operador" data-operador="-">-</button>

            <button class="btn-numero" data-numero="1">1</button>
            <button class="btn-numero" data-numero="2">2</button>
            <button class="btn-numero" data-numero="3">3</button>
            <button class="btn-operador" data-operador="+">+</button>

            <button class="btn-numero span-dos" data-numero="0">0</button>
            <button class="btn-numero" data-numero=".">.</button>
            <button class="btn-igual" id="btn-igual">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
